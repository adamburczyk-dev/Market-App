# NIE MA 'version:' — deprecated od Docker Compose v2
name: trading-system

services:
  # ==================== INFRASTRUCTURE ====================

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: ts-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-trading_db}
      POSTGRES_USER: ${DB_USER:-trader}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # pg_isready NIE uwierzytelnia — serwer z niepasującym hasłem raportował
      # `healthy`, podczas gdy każdy zapis z aplikacji leciał na
      # "password authentication failed". Logujemy się po TCP, tak jak serwisy.
      # (POSTGRES_PASSWORD dziala tylko przy TWORZENIU wolumenu: zmiana .env
      # pozniej wymaga ALTER USER albo skasowania wolumenu — patrz README.)
      test:
        - CMD-SHELL
        - PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' > /dev/null
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ts-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-dev_redis_pass}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-dev_redis_pass}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: ts-nats
    ports:
      - "4222:4222"   # Client
      - "8222:8222"   # Monitoring HTTP
    command: >
      --jetstream
      --store_dir /data
      --http_port 8222
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==================== OBSERVABILITY ====================

  prometheus:
    image: prom/prometheus:latest
    container_name: ts-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"

  grafana:
    image: grafana/grafana:latest
    container_name: ts-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: ts-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki

  # ==================== API GATEWAY ====================

  traefik:
    # Tag major, nie v3.0: klient Dockera wbudowany w v3.0 żąda API 1.24, a
    # Docker Engine 29 usunął obsługę API < 1.44 — provider zwracał wtedy
    # `Error response from daemon:` z pustą treścią i wpadał w pętlę retry.
    # Gdyby demon był starszy niż klient, wymuś wersję: DOCKER_API_VERSION=1.44.
    image: traefik:v3
    container_name: ts-gateway
    command:
      - "--api.insecure=true"
      - "--ping=true"          # /ping na entrypoincie traefik — źródło healthchecku
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      # bez tego awaria providera była widoczna wyłącznie w logach
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==================== APPLICATION SERVICES ====================

  market-data:
    build:
      context: ..
      dockerfile: services/market-data/Dockerfile
    container_name: ts-market-data
    environment:
      SERVICE_NAME: market-data
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading_db}
      DB_USER: ${DB_USER:-trader}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      NATS_URL: nats://nats:4222
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      # Scheduled incremental pull. market-data is the root of the event chain,
      # so with FETCH_SYMBOLS empty nothing downstream ever wakes up on its own.
      # Each run resumes from the newest stored bar, so a missed day is repaired
      # rather than lost.
      SCHEDULE_FETCH_ENABLED: ${SCHEDULE_FETCH_ENABLED:-true}
      FETCH_SYMBOLS: ${FETCH_SYMBOLS:-}
      FETCH_AT_HOUR_UTC: ${FETCH_AT_HOUR_UTC:-23}
      FETCH_OVERLAP_DAYS: ${FETCH_OVERLAP_DAYS:-5}
      FETCH_INITIAL_HISTORY_DAYS: ${FETCH_INITIAL_HISTORY_DAYS:-2190}
      FETCH_SYMBOL_PAUSE_S: ${FETCH_SYMBOL_PAUSE_S:-1.0}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ../services/market-data/src:/app/src   # hot-reload dev
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.market-data.rule=PathPrefix(`/api/v1/market-data`)"

  feature-engine:
    build:
      context: ..
      dockerfile: services/feature-engine/Dockerfile
    container_name: ts-feature-engine
    environment:
      SERVICE_NAME: feature-engine
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-trading_db}
      DB_USER: ${DB_USER:-trader}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      NATS_URL: nats://nats:4222
      MARKET_DATA_URL: http://market-data:8000
      # Tier-2 attribute enrichment (fundamentals announced by fundamentals.updated)
      FUNDAMENTAL_DATA_URL: http://fundamental-data:8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      market-data:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.feature-engine.rule=PathPrefix(`/api/v1/features`)"

  strategy:
    build:
      context: ..
      dockerfile: services/strategy/Dockerfile
    container_name: ts-strategy
    environment:
      SERVICE_NAME: strategy
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      FEATURE_ENGINE_URL: http://feature-engine:8000
      RISK_MGMT_URL: http://risk-mgmt:8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8003:8000"
    depends_on:
      nats:
        condition: service_healthy
      feature-engine:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.strategy.rule=PathPrefix(`/api/v1/strategy`)"

  backtest:
    build:
      context: ..
      dockerfile: services/backtest/Dockerfile
    container_name: ts-backtest
    environment:
      SERVICE_NAME: backtest
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-trading_db}
      DB_USER: ${DB_USER:-trader}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      NATS_URL: nats://nats:4222
      MARKET_DATA_URL: http://market-data:8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      market-data:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backtest.rule=PathPrefix(`/api/v1/backtest`)"

  ml-pipeline:
    build:
      context: ..
      dockerfile: services/ml-pipeline/Dockerfile
    container_name: ts-ml-pipeline
    environment:
      SERVICE_NAME: ml-pipeline
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      # training pulls the universe history over HTTP; models persist to the volume
      MARKET_DATA_URL: http://market-data:8000
      FUNDAMENTAL_DATA_URL: http://fundamental-data:8000
      MLFLOW_TRACKING_URI: sqlite:////app/mlruns/mlflow.db
      # Long-run reports land on the HOST, not in a container volume. A
      # training pass costs hours and produces one artifact; twice now that
      # artifact was destroyed by something unrelated to the work succeeding
      # (a client read timeout, then stopping the container). A bind mount
      # means the report exists on disk the moment it is written, whether or
      # not anything is still listening on the HTTP endpoint.
      RUN_REPORT_DIR: /app/run-reports
      # serving: features.ready → ranked vector + macro regime → ml.signal_generated
      FEATURE_ENGINE_URL: http://feature-engine:8000
      MACRO_DATA_URL: http://macro-data:8000
      # daily monitor pushes realized ML outcomes into the adaptive weights
      SIGNAL_AGGREGATOR_URL: http://signal-aggregator:8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    volumes:
      - ml_mlruns:/app/mlruns
      - ../reports:/app/run-reports
    ports:
      - "8005:8000"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 300s  # cold boot imports torch + mlflow (~2.5 min)
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ml-pipeline.rule=PathPrefix(`/api/v1/ml-pipeline`)"

  risk-mgmt:
    build:
      context: ..
      dockerfile: services/risk-mgmt/Dockerfile
    container_name: ts-risk-mgmt
    environment:
      SERVICE_NAME: risk-mgmt
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8006:8000"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.risk-mgmt.rule=PathPrefix(`/api/v1/risk-mgmt`)"

  dashboard:
    build:
      context: ..
      dockerfile: services/dashboard/Dockerfile
    container_name: ts-dashboard
    environment:
      SERVICE_NAME: dashboard
      RISK_MGMT_URL: http://risk-mgmt:8000
      EXECUTION_URL: http://execution:8000
      NOTIFICATION_URL: http://notification:8000
      ML_PIPELINE_URL: http://ml-pipeline:8000
      STRATEGY_URL: http://strategy:8000
      SIGNAL_AGGREGATOR_URL: http://signal-aggregator:8000
      MARKET_DATA_URL: http://market-data:8000
      BACKTEST_URL: http://backtest:8000
      FEATURE_ENGINE_URL: http://feature-engine:8000
      FUNDAMENTAL_DATA_URL: http://fundamental-data:8000
      MACRO_DATA_URL: http://macro-data:8000
      COMPANY_CLASSIFIER_URL: http://company-classifier:8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8501:8000"
    depends_on:
      - risk-mgmt
      - execution
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=PathPrefix(`/api/v1/dashboard`)"

  execution:
    build:
      context: ..
      dockerfile: services/execution/Dockerfile
    container_name: ts-execution
    environment:
      SERVICE_NAME: execution
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      RISK_MGMT_URL: http://risk-mgmt:8000
      MARKET_DATA_URL: http://market-data:8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8007:8000"
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy
      risk-mgmt:
        condition: service_healthy
      market-data:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.execution.rule=PathPrefix(`/api/v1/execution`)"

  notification:
    build:
      context: ..
      dockerfile: services/notification/Dockerfile
    container_name: ts-notification
    environment:
      SERVICE_NAME: notification
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      MIN_SEVERITY: ${MIN_SEVERITY:-info}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # e-mail channel enabled when host + from + recipients are all set
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_TO: ${EMAIL_TO:-}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8008:8000"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.notification.rule=PathPrefix(`/api/v1/notification`)"

  # ==================== ML/AI EXTENSION (serwisy 10-13) ====================

  fundamental-data:
    build:
      context: ..
      dockerfile: services/fundamental-data/Dockerfile
    container_name: ts-fundamental-data
    environment:
      SERVICE_NAME: fundamental-data
      # Postgres holds the point-in-time PANEL (P2-3): without it the service
      # still scores and publishes, but training has no as-of history to join.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading_db}
      DB_USER: ${DB_USER:-trader}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-}
      # Weekly EDGAR refresh of the universe. The service has had this scheduler
      # since it was built, but the variables were never passed through here, so
      # there was no way to turn it on in a running stack — the panel could only
      # be filled one POST /refresh/{symbol} at a time and then went stale.
      SCHEDULE_REFRESH_ENABLED: ${SCHEDULE_REFRESH_ENABLED:-true}
      REFRESH_SYMBOLS: ${REFRESH_SYMBOLS:-}
      REFRESH_SYMBOL_PAUSE_S: ${REFRESH_SYMBOL_PAUSE_S:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8009:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fundamental-data.rule=PathPrefix(`/api/v1/fundamental-data`)"

  macro-data:
    build:
      context: ..
      dockerfile: services/macro-data/Dockerfile
    container_name: ts-macro-data
    environment:
      SERVICE_NAME: macro-data
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      FRED_API_KEY: ${FRED_API_KEY:-}
      # Vintage panel (P2-4) — without it the live regime still works, but
      # history (and therefore the macro_* model features) does not.
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-trading_system}
      DB_USER: ${DB_USER:-trading}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8010:8000"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.macro-data.rule=PathPrefix(`/api/v1/macro-data`)"

  company-classifier:
    build:
      context: ..
      dockerfile: services/company-classifier/Dockerfile
    container_name: ts-company-classifier
    environment:
      SERVICE_NAME: company-classifier
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8011:8000"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.company-classifier.rule=PathPrefix(`/api/v1/company-classifier`)"

  signal-aggregator:
    build:
      context: ..
      dockerfile: services/signal-aggregator/Dockerfile
    container_name: ts-signal-aggregator
    environment:
      SERVICE_NAME: signal-aggregator
      NATS_URL: nats://nats:4222
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev_redis_pass}
      # sector enrichment for regime-aware sector caps (graceful None when down)
      COMPANY_CLASSIFIER_URL: http://company-classifier:8000
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
    ports:
      - "8012:8000"
    depends_on:
      nats:
        condition: service_healthy
    healthcheck:
      # python -c, not curl: the slim images ship no curl binary
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.signal-aggregator.rule=PathPrefix(`/api/v1/signal-aggregator`)"

volumes:
  postgres_data:
  redis_data:
  nats_data:
  prometheus_data:
  grafana_data:
  loki_data:
  ml_mlruns:
