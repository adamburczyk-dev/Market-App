repos:
  # Standardowe czystości kodu
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]   # pozwala na !! w YAML (np. Helm templates)
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: no-commit-to-branch
        args: [--branch, main]   # blokuj bezpośrednie commity do main

  # Ruff — linting + auto-fix
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Windows PowerShell 5.1 czyta pliki .ps1 BEZ BOM-u jako ANSI, więc każdy
  # bajt spoza ASCII rozwala parsowanie (myślnik "—" → "â€”" i błąd składni).
  # Trzymamy skrypty .ps1 w czystym ASCII — działa w każdej wersji i kodowaniu.
  - repo: local
    hooks:
      - id: ps1-ascii-only
        name: skrypty .ps1 muszą być czystym ASCII
        entry: python scripts/check-ps1-ascii.py
        language: system
        files: \.ps1$

      # Testy działają ze [dev] extras, obraz instaluje tylko runtime — pakiet
      # importowany, a niezadeklarowany, przechodzi lokalnie i zabija kontener
      # przy starcie (tak signal-aggregator pojechał bez httpx).
      - id: runtime-deps-declared
        name: każdy import runtime musi być zadeklarowany
        entry: python scripts/check-dependencies.py
        language: system
        pass_filenames: false
        files: (pyproject\.toml|/src/.*\.py)$
