name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Wykryj zmienione serwisy (nie testuj wszystkich przy zmianie jednego)
  # ============================================================
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            shared:
              - 'shared/**'
            market-data:
              - 'services/market-data/**'
              - 'shared/**'
            feature-engine:
              - 'services/feature-engine/**'
              - 'shared/**'
            strategy:
              - 'services/strategy/**'
              - 'shared/**'
            backtest:
              - 'services/backtest/**'
              - 'shared/**'
            ml-pipeline:
              - 'services/ml-pipeline/**'
              - 'shared/**'
            risk-mgmt:
              - 'services/risk-mgmt/**'
              - 'shared/**'
            execution:
              - 'services/execution/**'
              - 'shared/**'
            notification:
              - 'services/notification/**'
              - 'shared/**'
            dashboard:
              - 'services/dashboard/**'
              - 'shared/**'
            fundamental-data:
              - 'services/fundamental-data/**'
              - 'shared/**'
            macro-data:
              - 'services/macro-data/**'
              - 'shared/**'
            company-classifier:
              - 'services/company-classifier/**'
              - 'shared/**'
            signal-aggregator:
              - 'services/signal-aggregator/**'
              - 'shared/**'

  # ============================================================
  # Kontrakt zależności: import w runtime = wpis w [project] dependencies.
  # Testy widzą [dev] extras, obraz nie — bez tego brak pakietu wychodzi
  # dopiero jako ModuleNotFoundError przy starcie kontenera.
  # ============================================================
  check-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check-dependencies.py

  # ============================================================
  # Testy skryptów operacyjnych. Kontrola pokrycia danych decyduje, czy
  # trening dostaje zdrowe ceny — jej regresja jest cicha, więc ma testy.
  # ============================================================
  test-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # trading-common jest wymagany: testy skryptów pinują zgodność literałów
      # w skrypcie ze wspólnymi stałymi (mapa sektorów, pułap MAX_OHLCV_LIMIT).
      # Bez tego job wywracał się na zbieraniu testów — niewidocznie, bo CI nie
      # biegnie na gałęziach feature.
      - run: pip install pytest
      - run: pip install -e shared/trading-common
      - run: pytest scripts/tests/ -v

  # ============================================================
  # Testy shared library (wymagana przez wszystkie serwisy)
  # ============================================================
  test-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "shared/trading-common[dev]"
      - run: ruff check shared/trading-common/
      - run: mypy shared/trading-common/src/ --ignore-missing-imports
      - run: pytest shared/trading-common/tests/ -v --cov=shared/trading-common/src --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          flags: shared

  # ============================================================
  # Testy serwisów (matrix — tylko zmienione serwisy)
  # ============================================================
  test-services:
    needs: [detect-changes, test-shared]
    runs-on: ubuntu-latest
    # Uruchom tylko jeśli detect-changes wykrył co najmniej jeden zmieniony serwis
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    strategy:
      fail-fast: false
      matrix:
        # Dynamiczna macierz — tylko serwisy które się zmieniły (lub zależą od shared)
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install shared lib
        run: pip install -e shared/trading-common
      - name: Install service deps
        # 'shared' nie jest serwisem — pomijamy instalację i testy dla niego
        if: ${{ matrix.service != 'shared' }}
        run: pip install -e "services/${{ matrix.service }}[dev]"
      - name: Lint
        if: ${{ matrix.service != 'shared' }}
        run: ruff check services/${{ matrix.service }}/
      - name: Type check
        if: ${{ matrix.service != 'shared' }}
        run: cd services/${{ matrix.service }} && mypy src/
      - name: Test
        if: ${{ matrix.service != 'shared' }}
        run: |
          cd services/${{ matrix.service }}
          pytest tests/ -v --cov=src --cov-report=xml
      - uses: codecov/codecov-action@v4
        if: ${{ matrix.service != 'shared' }}
        with:
          flags: ${{ matrix.service }}
